{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto p-4">
    <h4 class="mb-3">Submit Campus Complaint</h4>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" placeholder="e.g., Broken AC Unit" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location / Room No.</label>
            <input type="text" name="location" class="form-control" placeholder="e.g., Lab 402" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                <option>Infrastructure</option>
                <option>IT & Wi-Fi</option>
                <option>Electrical</option>
                <option>Sanitation</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Attach Photo (Optional)</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit Report</button>
    </form>
</div>
{% endblock %}
